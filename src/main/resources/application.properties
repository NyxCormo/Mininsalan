# Configuration du serveur
server.port=8080
server.address=0.0.0.0


spring.application.name=Mininsalan

# db connection
spring.datasource.url=jdbc:postgresql://localhost:5432/mininsalan
spring.datasource.username=nyx
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=true

# Configuration du logging
logging.level.root=INFO
logging.level.com.speeddating=DEBUG
logging.level.spda.javaspring.speeddating=DEBUG

# Configuration Jackson pour les dates
spring.jackson.time-zone=Europe/Paris

# Configuration des uploads de fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuration du pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=SpeedDatingHikariPool
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Configuration CORS
cors.allowed-origins=http://localhost:3000

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=events
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
